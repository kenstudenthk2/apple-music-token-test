<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppleTune TV — Live</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
<style>
  /* Live-only additions. Everything else comes from the reviewed design system. */
  .boot {
    position: absolute;
    inset: var(--safe-y) var(--safe-x);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--space-3);
  }
  .boot__code {
    font-family: var(--font-num);
    font-size: var(--fs-display);
    font-weight: var(--fw-bold);
    letter-spacing: 0.12em;
    color: var(--art-accent);
  }
  .boot__url { font-size: var(--fs-title-sm); color: var(--text-primary); }
  .boot__status { font-size: var(--fs-body-lg); color: var(--text-tertiary); }
  .boot__error { color: var(--danger); }
  .boot__main {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: var(--space-8);
  }
  /* A QR must be true white with a quiet zone, or readers will not lock on. */
  #boot-qr { width: 100%; height: 100%; image-rendering: pixelated; }

  /* Real artwork, unlike the prototype's CSS gradients. */
  .tile__art img,
  .now__label img,
  .miniplayer__art img,
  .detail__art img,
  #library-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .now__label img { border-radius: 50%; }
  .detail__art, #library-art { overflow: hidden; }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ============================================================ SCREEN: BOOT -->
  <section class="screen" data-screen="boot" data-active="true">
    <div class="boot">
      <div class="boot__main">
        <div>
          <div class="pair__eyebrow">AppleTune TV</div>
          <h1 class="pair__headline" id="boot-title">Connecting…</h1>
          <div class="boot__url" id="boot-url"></div>
          <div class="boot__code" id="boot-code"></div>
          <div class="boot__status" id="boot-status">Starting up.</div>
        </div>

        <div class="pair__panel" id="boot-qr-panel" hidden>
          <div class="pair__qr"><canvas id="boot-qr"></canvas></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================================================ SCREEN: HOME -->
  <section class="screen" data-screen="home">
    <div class="screen__body">
      <nav class="nav" data-focus-group="nav-home">
        <div class="nav__brand">AppleTune</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="home" data-current="true">Home</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="library">Library</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="search">Search</div>
        <div class="nav__spacer"></div>
        <div class="nav__meta" id="home-clock"></div>
      </nav>
      <div class="shelves">
        <div class="shelves__track" id="home-shelves"></div>
      </div>
    </div>
  </section>

  <!-- ========================================================= SCREEN: LIBRARY -->
  <section class="screen" data-screen="library">
    <div class="screen__body">
      <nav class="nav" data-focus-group="nav-library">
        <div class="nav__brand">AppleTune</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="home">Home</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="library">Library</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="search">Search</div>
      </nav>
      <div class="detail">
        <div>
          <div class="detail__art" id="library-art"></div>
          <h2 class="detail__title">Your Library</h2>
          <p class="detail__sub" id="library-sub">Loading…</p>
        </div>
        <div class="list" data-focus-group="library-list" id="library-list"></div>
      </div>
    </div>
  </section>

  <!-- ========================================================== SCREEN: DETAIL -->
  <section class="screen" data-screen="detail">
    <div class="screen__body">
      <nav class="nav" data-focus-group="nav-detail">
        <div class="nav__brand">AppleTune</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="home">Home</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="library">Library</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="search">Search</div>
      </nav>
      <div class="detail">
        <div>
          <div class="detail__art" id="detail-art"></div>
          <h2 class="detail__title" id="detail-title">—</h2>
          <p class="detail__sub" id="detail-sub"></p>
        </div>
        <div class="list" data-focus-group="detail-list" id="detail-list"></div>
      </div>
    </div>
  </section>

  <!-- ========================================================== SCREEN: SEARCH -->
  <section class="screen" data-screen="search">
    <div class="screen__body">
      <nav class="nav" data-focus-group="nav-search">
        <div class="nav__brand">AppleTune</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="home">Home</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="library">Library</div>
        <div class="nav__item focusable" data-size="sm" data-focusable
             data-action="go" data-target="search">Search</div>
      </nav>
      <div class="search">
        <div>
          <div class="search__field">
            <span id="search-query"></span><span class="search__caret"></span>
          </div>
          <div class="search__keys" data-focus-group="keyboard" id="search-keys"></div>
        </div>
        <div class="list" data-focus-group="search-results" id="search-results"></div>
      </div>
    </div>
  </section>

  <!-- ===================================================== SCREEN: NOW PLAYING -->
  <section class="screen" data-screen="now">
    <div class="now" id="now" data-playing="false">
      <div class="now__bloom"></div>
      <div class="now__scrim"></div>
      <div class="now__body">
        <div class="now__disc">
          <div class="now__vinyl"></div>
          <div class="now__label" id="now-art"></div>
        </div>
        <div class="now__meta">
          <div class="now__eyebrow" id="now-source">Playing</div>
          <h1 class="now__title" id="now-title">—</h1>
          <p class="now__artist" id="now-artist">—</p>
          <p class="now__album" id="now-album">—</p>
        </div>
        <div class="now__transport">
          <div class="now__scrub">
            <span id="now-elapsed">0:00</span>
            <span class="now__bar"><span class="now__fill" id="now-fill"></span></span>
            <span id="now-total">0:00</span>
          </div>
          <div class="now__buttons" data-focus-group="transport">
            <div class="control focusable" data-size="sm" data-focusable
                 data-action="prev" aria-label="Previous track">⏮</div>
            <div class="control focusable" data-size="sm" data-focusable
                 data-action="playpause" data-primary="true"
                 id="now-playpause" aria-label="Play or pause">▶</div>
            <div class="control focusable" data-size="sm" data-focusable
                 data-action="next" aria-label="Next track">⏭</div>
          </div>
        </div>
      </div>
    </div>
    <div class="hints">
      <span><kbd>BACK</kbd>Back</span>
      <span><kbd>OK</kbd>Play / Pause</span>
    </div>
  </section>

  <!-- Persistent across every browse screen, so "what is playing" is always
       answerable without navigating anywhere. -->
  <div class="miniplayer" id="miniplayer">
    <div class="miniplayer__art" id="mini-art"></div>
    <div class="miniplayer__text">
      <div class="miniplayer__title" id="mini-title">—</div>
      <div class="miniplayer__artist" id="mini-artist">—</div>
    </div>
    <div class="miniplayer__hint">Now playing</div>
  </div>

</div>

<script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" data-web-components async></script>
<script type="module" src="scripts/live-app.js"></script>
</body>
</html>
