<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activate your TV</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 2rem 1.25rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
        max-width: 32rem;
        margin-inline: auto;
      }
      h1 { font-size: 1.5rem; }
      code { font-size: 1.25rem; font-weight: 600; }
      button {
        font: inherit;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        border: 0;
        background: #fa2d48;
        color: #fff;
        cursor: pointer;
      }
      button[disabled] { opacity: 0.5; cursor: default; }
      #status { margin-top: 1.5rem; white-space: pre-wrap; }
      .error { color: #c00; }
      .ok { color: #0a0; }
    </style>
  </head>
  <body>
    <h1>Activate <code id="code"></code></h1>
    <p>Sign in with the Apple ID that has your Apple Music subscription.</p>
    <button id="authorize" disabled>Loading MusicKit…</button>
    <p id="status"></p>

    <script
      src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"
      data-web-components
      async
    ></script>
    <script>
      const code = location.pathname.split("/").pop().toUpperCase();
      const codeEl = document.getElementById("code");
      const button = document.getElementById("authorize");
      const statusEl = document.getElementById("status");

      codeEl.textContent = code;

      function setStatus(message, className = "") {
        statusEl.textContent = message;
        statusEl.className = className;
      }

      // MusicKit v3 fires this once the CDN script has finished loading.
      document.addEventListener("musickitloaded", async () => {
        try {
          const response = await fetch("/api/developer-token");
          if (!response.ok) {
            throw new Error(`developer token request failed: ${response.status}`);
          }
          const { developerToken } = await response.json();

          await MusicKit.configure({
            developerToken,
            app: { name: "TV Pairing POC", build: "1.0.0" },
          });

          button.disabled = false;
          button.textContent = "Authorize Apple Music";
          setStatus("Ready.");
        } catch (error) {
          setStatus(`Setup failed: ${error.message}`, "error");
        }
      });

      button.addEventListener("click", async () => {
        button.disabled = true;
        setStatus("Waiting for Apple authorization…");

        try {
          const music = MusicKit.getInstance();
          // Opens Apple's sign-in popup. Pop-up blockers must allow it.
          const musicUserToken = await music.authorize();
          if (!musicUserToken) {
            throw new Error("Apple returned an empty Music User Token.");
          }

          // Hands the token to the pairing server against the user_code — the
          // only code this page has ever seen. The response is 204 with no
          // body: this endpoint never returns a token, so it cannot leak one.
          const response = await fetch(`/api/activate/${code}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ musicUserToken }),
          });
          if (response.status === 404) {
            throw new Error("That pairing code has expired. Start again on your TV.");
          }
          if (response.status === 429) {
            throw new Error("Too many attempts. Wait a minute and try again.");
          }
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.error || `HTTP ${response.status}`);
          }

          setStatus("Authorized. You can return to your TV.", "ok");
        } catch (error) {
          button.disabled = false;
          setStatus(`Authorization failed: ${error.message}`, "error");
        }
      });
    </script>
  </body>
</html>
